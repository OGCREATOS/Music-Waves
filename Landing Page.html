<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Waves — Music & Art School</title>
    <meta name="description"
        content="Music Waves — Learn Piano, Guitar, Violin, Drums, Vocals, Drawing & Painting.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" href="assets/Music Waves Logo(2).png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden
        }

        .landing {
            padding: 40px 24px;
            max-width: 560px
        }

        /* logo */
        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: repeating-radial-gradient(circle, #222 0 2px, #0a0a0a 2px 5px);
            border: 4px solid #333;
            position: relative;
            margin: 0 auto 28px;
            animation: spin 6s linear infinite
        }

        .logo-hole {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 28px;
            height: 28px;
            background: #fff;
            border-radius: 50%
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* equaliser */
        .bars {
            display: flex;
            gap: 5px;
            justify-content: center;
            align-items: flex-end;
            height: 32px;
            margin-bottom: 24px
        }

        .bars span {
            width: 6px;
            background: #fff;
            border-radius: 3px;
            animation: eq 1s ease-in-out infinite
        }

        .bars span:nth-child(odd) {
            height: 20px
        }

        .bars span:nth-child(even) {
            height: 32px
        }

        .bars span:nth-child(3n) {
            animation-delay: .2s
        }

        .bars span:nth-child(4n) {
            animation-delay: .4s
        }

        @keyframes eq {

            0%,
            100% {
                transform: scaleY(.4)
            }

            50% {
                transform: scaleY(1)
            }
        }

        h1 {
            font-family: 'Archivo', sans-serif;
            font-size: clamp(30px, 6vw, 52px);
            font-weight: 900;
            line-height: 1.06;
            margin-bottom: 14px
        }

        h1 .outline {
            -webkit-text-stroke: 2px #fff;
            color: transparent
        }

        .lead {
            color: #aaa;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px
        }

        /* subjects */
        .subjects {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 36px
        }

        .subjects span {
            background: #161616;
            border: 1px solid #333;
            border-radius: 100px;
            padding: 7px 16px;
            font-size: 14px;
            font-weight: 600;
            transition: .25s
        }

        .subjects span:hover {
            border-color: #fff;
            color: #fff
        }

        /* CTA */
        .cta {
            display: inline-block;
            padding: 16px 40px;
            background: #fff;
            color: #000;
            font-family: 'Archivo', sans-serif;
            font-weight: 900;
            font-size: 17px;
            text-decoration: none;
            border-radius: 14px;
            border: 3px solid #fff;
            transition: .3s;
            position: relative;
            overflow: hidden
        }

        .cta:hover {
            background: transparent;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(255, 255, 255, .15)
        }

        .cta::after {
            content: "";
            position: absolute;
            top: 0;
            left: -70%;
            width: 45%;
            height: 100%;
            background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-20deg);
            animation: shine 2.8s infinite
        }

        @keyframes shine {
            to {
                left: 130%
            }
        }

        .note {
            position: absolute;
            font-size: 40px;
            opacity: .08;
            animation: float 5s ease-in-out infinite;
            pointer-events: none
        }

        .n1 {
            top: 12%;
            left: 8%
        }

        .n2 {
            top: 20%;
            right: 10%;
            animation-delay: 1s;
            font-size: 52px
        }

        .n3 {
            bottom: 18%;
            left: 10%;
            animation-delay: 2s
        }

        .n4 {
            bottom: 14%;
            right: 8%;
            animation-delay: 3s;
            font-size: 46px
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(-6deg)
            }

            50% {
                transform: translateY(-18px) rotate(6deg)
            }
        }

        .footer-note {
            margin-top: 40px;
            color: #555;
            font-size: 13px
        }
    </style>
</head>

<body>

    <span class="note n1">♪</span>
    <span class="note n2">♫</span>
    <span class="note n3">♩</span>
    <span class="note n4">♬</span>

    <div class="landing">
        <div class="logo">
            <div class="logo-hole"></div>
        </div>
        <div class="bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <h1>Feel the Rhythm.<br><span class="outline">Learn the Music.</span></h1>
        <p class="lead">Music & art school for all ages. Expert teachers & offline classes.</p>

        <div class="subjects">
            <span>🎹 Piano</span>
            <span>🎸 Guitar</span>
            <span>🎻 Violin</span>
            <span>🥁 Drums</span>
            <span>🎤 Vocals</span>
            <span>✏️ Drawing</span>
            <span>🎨 Painting</span>
        </div>

        <a href="index.html" class="cta">Enter Music Waves →</a>
        <p class="footer-note">₹600/mo • Trivandrum</p>
    </div>

</body>

</html>
