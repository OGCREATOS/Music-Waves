<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Music Waves</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Inter:wght@400;500;600&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative
        }

        /* Animated background bars */
        .bg-bars {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            padding-bottom: 8vh;
            opacity: .06;
            pointer-events: none
        }

        .bg-bars span {
            width: 12px;
            background: #fff;
            border-radius: 6px;
            animation: barPulse 1.4s ease-in-out infinite
        }

        .bg-bars span:nth-child(1) { height: 20%; animation-delay: 0s }
        .bg-bars span:nth-child(2) { height: 35%; animation-delay: .1s }
        .bg-bars span:nth-child(3) { height: 50%; animation-delay: .2s }
        .bg-bars span:nth-child(4) { height: 30%; animation-delay: .3s }
        .bg-bars span:nth-child(5) { height: 60%; animation-delay: .15s }
        .bg-bars span:nth-child(6) { height: 40%; animation-delay: .25s }
        .bg-bars span:nth-child(7) { height: 25%; animation-delay: .35s }
        .bg-bars span:nth-child(8) { height: 55%; animation-delay: .05s }
        .bg-bars span:nth-child(9) { height: 30%; animation-delay: .2s }
        .bg-bars span:nth-child(10) { height: 45%; animation-delay: .3s }
        .bg-bars span:nth-child(11) { height: 20%; animation-delay: .1s }
        .bg-bars span:nth-child(12) { height: 35%; animation-delay: .25s }

        @keyframes barPulse {
            0%, 100% { transform: scaleY(.4) }
            50% { transform: scaleY(1) }
        }

        .container {
            text-align: center;
            padding: 40px 24px;
            position: relative;
            z-index: 2
        }

        .code {
            font-family: 'Archivo', sans-serif;
            font-size: clamp(100px, 20vw, 200px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff 0%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeIn 1s cubic-bezier(.25, .1, .25, 1) both
        }

        .note {
            font-size: clamp(28px, 5vw, 48px);
            margin-bottom: 12px;
            animation: float 3s ease-in-out infinite;
            display: inline-block
        }

        h1 {
            font-family: 'Archivo', sans-serif;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 800;
            margin: 16px 0 12px;
            animation: fadeIn 1s cubic-bezier(.25, .1, .25, 1) .15s both
        }

        p {
            color: #999;
            font-size: clamp(14px, 2.5vw, 17px);
            max-width: 420px;
            margin: 0 auto 32px;
            line-height: 1.6;
            animation: fadeIn 1s cubic-bezier(.25, .1, .25, 1) .3s both
        }

        .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 1s cubic-bezier(.25, .1, .25, 1) .45s both
        }

        .btn {
            display: inline-block;
            padding: 13px 28px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            text-decoration: none;
            border: 3px solid #fff;
            cursor: pointer;
            transition: .35s cubic-bezier(.4, 0, .2, 1)
        }

        .btn-primary {
            background: #fff;
            color: #0a0a0a
        }

        .btn-primary:hover {
            background: #111110;
            color: #fff;
            border-color: #111110;
            transform: translateY(-2px)
        }

        .btn-ghost {
            background: transparent;
            color: #fff
        }

        .btn-ghost:hover {
            background: #fff;
            color: #0a0a0a;
            transform: translateY(-2px)
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) }
            to { opacity: 1; transform: none }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-4deg) }
            50% { transform: translateY(-10px) rotate(4deg) }
        }

        .brand {
            margin-top: 48px;
            animation: fadeIn 1s cubic-bezier(.25, .1, .25, 1) .6s both
        }

        .brand img {
            height: 60px;
            filter: grayscale(1) contrast(1.2) invert(1);
            opacity: .4;
            transition: opacity .35s cubic-bezier(.4, 0, .2, 1)
        }

        .brand img:hover {
            opacity: .7
        }
    </style>
</head>
<body>
    <div class="bg-bars">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>
    <div class="container">
        <div class="note">♪</div>
        <div class="code">404</div>
        <h1>Wrong Note!</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back on rhythm.</p>
        <div class="actions">
            <a href="index.html" class="btn btn-primary">← Back to Home</a>
            <a href="index.html#contact" class="btn btn-ghost">Contact Us</a>
        </div>
        <div class="brand">
            <img src="assets/Music Waves Logo.png" alt="Music Waves Music & Art School">
        </div>
    </div>
</body>
</html>
